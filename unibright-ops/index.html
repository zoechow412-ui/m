<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>恆輝工程管理系統</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Microsoft JhengHei",Arial,sans-serif;margin:0;background:#f5f6f4;color:#17211d}header{background:#0c2f59;color:white;padding:18px 22px}header h1{margin:0;font-size:24px}nav{display:flex;gap:8px;padding:10px;background:white;position:sticky;top:0;overflow:auto;border-bottom:1px solid #ddd}button{border:0;border-radius:8px;padding:10px 13px;font-weight:700;cursor:pointer;background:#0c2f59;color:white}nav button{background:#edf1f5;color:#0c2f59}.active{background:#0c2f59!important;color:white!important}.wrap{max-width:1180px;margin:auto;padding:14px}.panel{background:white;border:1px solid #d9dfdc;border-radius:12px;padding:14px;margin-bottom:12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:white;border:1px solid #d9dfdc;border-radius:12px;padding:14px}.card b{font-size:23px;color:#0c2f59}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%}th,td{border:1px solid #d3dad6;padding:8px;text-align:left}th{background:#0c2f59;color:white}.money{color:#a71919;font-weight:800}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.muted{color:#6c756f}.hide{display:none}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,textarea{padding:9px;border:1px solid #cbd3cf;border-radius:8px;width:100%;box-sizing:border-box}.field{margin-bottom:8px}.field label{font-size:12px;color:#6c756f;display:block;margin-bottom:3px}.qty{display:flex;gap:4px;align-items:center}.qty input{width:70px}.qty button{width:32px;height:32px;padding:0;background:white;color:#0c2f59;border:1px solid #bbb}.tier{display:flex;gap:8px}.tier button{flex:1;background:white;color:#0c2f59;border:1px solid #d9dfdc}.tier .on{background:#0c2f59;color:white}.catalog{max-height:360px;overflow:auto;border:1px solid #ddd;border-radius:8px}.cat{padding:9px;border-bottom:1px solid #eee;display:grid;grid-template-columns:1fr auto;gap:8px}.total{max-width:400px;margin-left:auto}.total div{display:flex;justify-content:space-between;padding:7px;border-bottom:1px solid #eee}.total .grand{font-size:20px;color:#a71919;font-weight:800}@media(max-width:760px){.cards{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.wrap{padding:9px}table{font-size:12px}}@media print{header,nav,.no-print{display:none!important}.wrap{max-width:none;padding:0}.panel{border:0}}</style></head><body><header><h1>恆輝工程管理系統</h1><div>UNIBRIGHT CONSTRUCTION (H.K.) LIMITED</div></header><nav id="nav"><button class="active" data-t="dashboard">Dashboard</button><button data-t="projects">項目</button><button data-t="quotation">報價單</button><button data-t="invoice">Invoice</button><button data-t="receipt">Receipt / 收款</button><button data-t="pricing">價目表</button></nav><main class="wrap"><div id="app">正在載入…</div></main><script>const BASE='https://bkjrzksoruhlzwrzpovw.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJranJ6a3NvcnVobHp3cnpwb3Z3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3Nzc2ODQsImV4cCI6MjEwMjM1MzY4NH0.RSoUlsO1ae8M6O7X62BgF42CnV2kMW7NtYR3ez1pPWU',H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};let D={projects:[],summary:[],clients:[],quotes:[],invoices:[],payments:[],pricing:[]},tab='dashboard',draft=[],tier='customer';const app=document.getElementById('app');const n=x=>Number(x||0),hk=x=>'HK$'+n(x).toLocaleString('en-HK',{minimumFractionDigits:2,maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>new Date().toISOString().slice(0,10),gen=p=>p+'/'+today().replaceAll('-','').slice(2)+'/'+String(Date.now()).slice(-5);async function api(t,q='',o={}){let r=await fetch(BASE+'/rest/v1/'+t+q,{method:o.method||'GET',headers:{...H,Prefer:'return=representation'},body:o.body?JSON.stringify(o.body):undefined}),x=await r.text();if(!r.ok)throw Error(x);return x?JSON.parse(x):[]}async function load(){try{let [p,s,c,q,i,pa,pc]=await Promise.all([api('projects','?select=*&order=created_at.desc'),api('project_financial_summary','?select=*'),api('clients','?select=*'),api('quotations','?select=*&order=created_at.desc'),api('invoices','?select=*&order=created_at.desc'),api('payments','?select=*&order=payment_date.desc'),api('pricing_catalog','?select=*&active=eq.true&order=price_tier,item_code')]);D={projects:p,summary:s,clients:c,quotes:q,invoices:i,payments:pa,pricing:pc};render()}catch(e){app.innerHTML='<div class="panel"><b>資料庫連線失敗</b><br>'+esc(e.message)+'</div>'}}function show(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.t===t));render()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.t));function render(){({dashboard:dash,projects:projectHome,quotation:quoteHome,invoice:invoiceHome,receipt:receiptHome,pricing:pricingHome}[tab]||dash)()}function sproj(id){return D.summary.find(x=>x.project_id===id)||{}}function client(pid){let p=D.projects.find(x=>x.id===pid);return D.clients.find(c=>c.id===p?.client_id)||{}}function rows(){return D.projects.map(p=>{let s=sproj(p.id);return '<tr><td><b>'+esc(p.project_no)+'</b><br>'+esc(p.project_name)+'<br><small>'+esc(p.site_address||'')+'</small></td><td>'+esc(p.status)+'</td><td>'+n(p.progress_percent)+'%</td><td>'+hk(p.contract_amount)+'</td><td>'+hk(s.received_amount)+'</td><td class="money">'+hk(s.outstanding_amount??p.contract_amount)+'</td><td><button onclick="progress(\''+p.id+'\')">更新</button></td></tr>'}).join('')}function dash(){let x=D.summary.reduce((a,p)=>({c:a.c+n(p.contract_amount),r:a.r+n(p.received_amount),o:a.o+n(p.outstanding_amount)}),{c:0,r:0,o:0});app.innerHTML='<div class="cards"><div class="card">項目<br><b>'+D.projects.length+'</b></div><div class="card">合約總額<br><b>'+hk(x.c)+'</b></div><div class="card">已收<br><b>'+hk(x.r)+'</b></div><div class="card">尚欠<br><b class="money">'+hk(x.o)+'</b></div></div><div class="panel"><div class="row space"><h2>項目進度及收款</h2><button onclick="newQuote()">＋ 新報價</button></div><div class="tablewrap"><table><tr><th>項目</th><th>狀態</th><th>進度</th><th>合約額</th><th>已收</th><th>尚欠</th><th></th></tr>'+rows()+'</table></div></div>'}function projectHome(){app.innerHTML='<div class="panel"><h2>項目管理</h2><div class="tablewrap"><table><tr><th>項目</th><th>狀態</th><th>進度</th><th>合約額</th><th>已收</th><th>尚欠</th><th></th></tr>'+rows()+'</table></div></div>'}async function progress(id){let p=D.projects.find(x=>x.id===id),v=prompt('工程進度 0-100',p.progress_percent);if(v===null)return;let st=prompt('狀態：報價中／已確認／施工中／待收款／已完成',p.status)||p.status;await api('projects','?id=eq.'+id,{method:'PATCH',body:{progress_percent:Math.max(0,Math.min(100,n(v))),status:st}});load()}function quoteHome(){app.innerHTML='<div class="panel"><div class="row space"><h2>報價單</h2><button onclick="newQuote()">＋ 新報價</button></div><div class="tablewrap"><table><tr><th>編號</th><th>類別</th><th>日期</th><th>狀態</th><th>總額</th><th></th></tr>'+D.quotes.map(q=>'<tr><td>'+esc(q.quotation_no)+'</td><td>'+(q.price_tier==='trade'?'同行價':'客戶價')+'</td><td>'+q.issue_date+'</td><td>'+q.status+'</td><td class="money">'+hk(q.total)+'</td><td><button onclick="viewQuote(\''+q.id+'\')">正式報價單</button> '+(q.status!=='已轉Invoice'?'<button onclick="convert(\''+q.id+'\')">轉 Invoice</button>':'')+'</td></tr>').join('')+'</table></div></div>'}function newQuote(){tier='customer';draft=[];drawEditor()}function newFields(){return '<div id="newp" class="hide"><div class="grid2"><div><div class="field"><label>客戶／公司名</label><input id="ncname"></div><div class="field"><label>聯絡人</label><input id="ncontact"></div><div class="field"><label>電話</label><input id="nphone"></div><div class="field"><label>Email</label><input id="nemail"></div><div class="field"><label>客戶地址</label><textarea id="ncaddr"></textarea></div></div><div><div class="field"><label>工程編號</label><input id="npno" value="PRJ-'+today().replaceAll('-','')+'"></div><div class="field"><label>工程項目名稱</label><input id="npname"></div><div class="field"><label>施工地址</label><textarea id="nsite"></textarea></div></div></div></div>'}function drawEditor(){app.innerHTML='<div class="panel"><h2>建立報價</h2><div class="tier"><button id="tc" class="on" onclick="setTier(\'customer\')">客戶價</button><button id="tt" onclick="setTier(\'trade\')">同行價</button></div><div class="field" style="margin-top:10px"><label>工程／項目</label><select id="qproj" onchange="newp.classList.toggle(\'hide\',this.value!==\'NEW\')"><option value="NEW">＋ 新工程／自行輸入名稱</option>'+D.projects.map(p=>'<option value="'+p.id+'">'+esc(p.project_no)+'｜'+esc(p.project_name)+'</option>').join('')+'</select></div>'+newFields()+'<div class="grid2"><div><h3>標準價目</h3><div id="catalog" class="catalog"></div></div><div><h3>折扣</h3><div class="row"><select id="dtype" onchange="calc()"><option value="percent">百分比 %</option><option value="fixed">固定金額</option></select><input id="dval" type="number" value="0" oninput="calc()"></div></div></div><div id="items"></div><button onclick="draft.push({description:\'\',unit:\'項\',quantity:1,unit_price:0});drawItems()">＋ 自訂項目</button><div class="total"><div>小計 <b id="sub"></b></div><div>折扣 <b id="dis"></b></div><div class="grand">總額 <b id="tot"></b></div></div><button onclick="saveQuote()">儲存報價</button></div>';newp.classList.remove('hide');drawCat();drawItems()}function setTier(t){tier=t;tc.classList.toggle('on',t==='customer');tt.classList.toggle('on',t==='trade');draft=[];drawCat();drawItems()}function drawCat(){catalog.innerHTML=D.pricing.filter(x=>x.price_tier===tier).map(x=>'<div class="cat"><div><b>'+esc(x.description)+'</b><br><small>'+hk(x.unit_price)+'／'+esc(x.unit)+' · '+esc(x.pricing_rule||'')+'</small></div><button onclick="pick(\''+x.item_code+'\')">加入</button></div>').join('')}function pick(code){let x=D.pricing.find(v=>v.item_code===code);draft.push({description:x.description,unit:x.unit,quantity:1,unit_price:n(x.unit_price)});drawItems()}function drawItems(){items.innerHTML='<div class="tablewrap"><table><tr><th>工程項目</th><th>單位</th><th>數量</th><th>單價</th><th>小計</th><th></th></tr>'+draft.map((x,i)=>'<tr><td><input value="'+esc(x.description)+'" oninput="draft['+i+'].description=this.value"></td><td><input value="'+esc(x.unit)+'" oninput="draft['+i+'].unit=this.value"></td><td><div class="qty"><button onclick="draft['+i+'].quantity=Math.max(0,n(draft['+i+'].quantity)-1);drawItems()">−</button><input type="number" value="'+x.quantity+'" oninput="draft['+i+'].quantity=n(this.value);calc()"><button onclick="draft['+i+'].quantity++;drawItems()">＋</button></div></td><td><input type="number" value="'+x.unit_price+'" oninput="draft['+i+'].unit_price=n(this.value);calc()"></td><td id="ln'+i+'">'+hk(n(x.quantity)*n(x.unit_price))+'</td><td><button onclick="draft.splice('+i+',1);drawItems()">刪除</button></td></tr>').join('')+'</table></div>';calc()}function calc(){let s=draft.reduce((a,x)=>a+n(x.quantity)*n(x.unit_price),0),v=n(dval?.value),d=dtype?.value==='fixed'?Math.min(s,v):s*v/100,t=s-d;if(sub){sub.textContent=hk(s);dis.textContent=hk(d);tot.textContent=hk(t)}draft.forEach((x,i)=>{let e=document.getElementById('ln'+i);if(e)e.textContent=hk(n(x.quantity)*n(x.unit_price))});return{s,d,t,v,type:dtype?.value||'percent'}}async function makeNewProject(){let c=await api('clients','',{method:'POST',body:{company_name:ncname.value||'未命名客戶',contact_name:ncontact.value,phone:nphone.value,email:nemail.value,address:ncaddr.value}}),p=await api('projects','',{method:'POST',body:{project_no:npno.value||gen('PRJ'),client_id:c[0].id,project_name:npname.value||'新工程',site_address:nsite.value,status:'報價中',progress_percent:0,contract_amount:0}});return p[0].id}async function saveQuote(){let pid=qproj.value==='NEW'?await makeNewProject():qproj.value,c=calc(),q=await api('quotations','',{method:'POST',body:{quotation_no:gen(tier==='trade'?'TQ':'QO'),project_id:pid,discount_type:c.type,discount_value:c.v,subtotal:c.s,discount_amount:c.d,total:c.t,status:'草稿',price_tier:tier,valid_until:new Date(Date.now()+90*86400000).toISOString().slice(0,10)}});if(draft.length)await api('quotation_items','',{method:'POST',body:draft.filter(x=>x.description).map((x,i)=>({quotation_id:q[0].id,sort_order:i+1,description:x.description,unit:x.unit,quantity:x.quantity,unit_price:x.unit_price,amount:n(x.quantity)*n(x.unit_price)}))});await load();tab='quotation';render();alert('報價已儲存')}async function convert(id){let q=D.quotes.find(x=>x.id===id),its=await api('quotation_items','?quotation_id=eq.'+id+'&select=*&order=sort_order'),dp=n(prompt('本期訂金百分比','50'));let iv=await api('invoices','',{method:'POST',body:{invoice_no:gen('INV'),project_id:q.project_id,quotation_id:id,subtotal:q.subtotal,discount_amount:q.discount_amount,total:q.total,amount_paid:0,amount_due:q.total,status:'未付款',notes:'DEPOSIT_PERCENT='+dp}});await api('invoice_items','',{method:'POST',body:its.map((x,i)=>({invoice_id:iv[0].id,sort_order:i+1,description:x.description,unit:x.unit,quantity:x.quantity,unit_price:x.unit_price,amount:x.amount}))});await api('quotations','?id=eq.'+id,{method:'PATCH',body:{status:'已轉Invoice'}});await api('projects','?id=eq.'+q.project_id,{method:'PATCH',body:{contract_amount:q.total,status:'已確認'}});load();tab='invoice'}function invoiceHome(){app.innerHTML='<div class="panel"><h2>Invoice</h2><div class="tablewrap"><table><tr><th>Invoice</th><th>日期</th><th>狀態</th><th>總額</th><th>已收</th><th>尚欠</th><th></th></tr>'+D.invoices.map(x=>'<tr><td>'+x.invoice_no+'</td><td>'+x.issue_date+'</td><td>'+x.status+'</td><td>'+hk(x.total)+'</td><td>'+hk(x.amount_paid)+'</td><td class="money">'+hk(x.amount_due)+'</td><td><button onclick="viewInvoice(\''+x.id+'\')">正式 Invoice</button> '+(n(x.amount_due)>0?'<button onclick="pay(\''+x.id+'\')">收款</button>':'')+'</td></tr>').join('')+'</table></div></div>'}async function pay(id){let x=D.invoices.find(v=>v.id===id),a=n(prompt('收款金額',x.amount_due));if(!a)return;await api('payments','',{method:'POST',body:{project_id:x.project_id,invoice_id:id,receipt_no:gen('RCP'),payment_date:today(),amount:a,method:prompt('方式：FPS／銀行轉帳／支票／現金','FPS')||'FPS',reference_no:prompt('參考編號','')||'',remarks:prompt('備註','')||''}});load();tab='receipt'}function receiptHome(){app.innerHTML='<div class="panel"><h2>Receipt / 收款</h2><div class="tablewrap"><table><tr><th>Receipt</th><th>日期</th><th>金額</th><th>方式</th><th></th></tr>'+D.payments.map(x=>'<tr><td>'+esc(x.receipt_no||'')+'</td><td>'+x.payment_date+'</td><td class="money">'+hk(x.amount)+'</td><td>'+esc(x.method||'')+'</td><td><button onclick="viewReceipt(\''+x.id+'\')">正式收據</button></td></tr>').join('')+'</table></div></div>'}function pricingHome(){app.innerHTML='<div class="panel"><h2>價目表</h2><div class="tablewrap"><table><tr><th>類別</th><th>工程項目</th><th>單位</th><th>單價</th><th>計價規則</th></tr>'+D.pricing.map(x=>'<tr><td>'+(x.price_tier==='trade'?'同行':'客戶')+'</td><td>'+esc(x.description)+'</td><td>'+esc(x.unit)+'</td><td class="money">'+hk(x.unit_price)+'</td><td>'+esc(x.pricing_rule||'')+'</td></tr>').join('')+'</table></div></div>'}load();</script><script src="v3/formal-docs.js"></script></body></html>
