<html lang="zh-HK">

<title>恆輝工程管理系統｜UNIBRIGHT</title>
<style>
:root{--navy:#0c2f59;--green:#153d34;--gold:#ae8734;--red:#b42318;--bg:#f5f6f4;--line:#d9dfdc;--muted:#6d7772;--ink:#18211d}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Microsoft JhengHei",Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.top{background:linear-gradient(120deg,var(--navy),#123f70);color:white;padding:20px 22px}.top h1{margin:0;font-size:25px}.top p{margin:4px 0 0;opacity:.82;font-size:13px}.nav{display:flex;gap:7px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);overflow:auto;position:sticky;top:0;z-index:20}.nav button{white-space:nowrap;border:0;border-radius:9px;padding:10px 13px;font-weight:800;background:#edf1f5;color:var(--navy);cursor:pointer}.nav button.active{background:var(--navy);color:#fff}.wrap{max-width:1240px;margin:auto;padding:16px}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px #00000008}.panel{padding:16px;margin-bottom:14px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{padding:15px}.card span{font-size:13px;color:var(--muted)}.card b{display:block;margin-top:5px;font-size:24px;color:var(--navy)}.card b.red,.money{color:var(--red)!important;font-weight:850}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800;background:var(--navy);color:#fff;cursor:pointer}.btn.green{background:var(--green)}.btn.gold{background:var(--gold)}.btn.red{background:var(--red)}.btn.light{background:#edf1f5;color:var(--navy)}.btn.sm{padding:7px 10px;font-size:13px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:14px}.table th{background:var(--navy);color:#fff}.table th,.table td{border:1px solid var(--line);padding:9px;vertical-align:top}.muted{color:var(--muted)}.pill{display:inline-block;border-radius:999px;background:#edf3f0;padding:5px 9px;font-size:12px;font-weight:750}.progress{height:9px;background:#e8ecea;border-radius:9px;overflow:hidden;margin-top:5px}.progress i{display:block;height:100%;background:var(--navy)}input,select,textarea{border:1px solid #cbd3cf;border-radius:8px;padding:9px;background:#fff;color:var(--ink)}.wide{width:100%}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:9px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.qty{display:flex;gap:5px;align-items:center}.qty button{width:34px;height:34px;border:1px solid #bcc7c2;background:#fff;border-radius:7px;font-size:19px}.qty input{width:78px;text-align:center}.tier{display:flex;gap:8px}.tier button{flex:1;padding:13px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:850}.tier button.on{background:var(--navy);color:#fff}.catalog{max-height:390px;overflow:auto;border:1px solid var(--line);border-radius:10px}.catalog-item{padding:10px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:10px}.catalog-item:last-child{border-bottom:0}.catalog-item b{display:block}.catalog-item small{color:var(--muted)}.planbar{display:flex;gap:8px;flex-wrap:wrap}.planbar button{border:1px solid var(--gold);background:#fff7e6;color:#684f16;border-radius:9px;padding:9px 12px;font-weight:800}.totalbox{margin-left:auto;max-width:430px;margin-top:12px}.totalbox div{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee}.totalbox .grand{font-size:20px;font-weight:900;color:var(--red)}.newbox{margin-top:10px;padding:14px;border-radius:11px;background:#f7faf8;border:1px solid #cddbd4}.newbox h3{margin-top:0;color:var(--green)}.notice{background:#fff5d9;border:1px solid #ead28e;border-radius:10px;padding:10px 12px;margin-bottom:12px}.doc{background:#fff;max-width:900px;margin:auto}.dochead{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid var(--navy);padding-bottom:12px;margin-bottom:14px}.dochead h2{margin:0;color:var(--navy)}.meta{font-size:13px;line-height:1.6}.hide{display:none!important}.loading{padding:30px;text-align:center;color:var(--muted)}.footer{text-align:center;color:var(--muted);font-size:12px;padding:16px}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.wrap{padding:10px}.top{padding:16px}.top h1{font-size:21px}.table{font-size:12px}.dochead{display:block}.catalog-item{grid-template-columns:1fr}.nav{padding:8px}.btn{padding:9px 11px}}@media print{body{background:#fff}.top,.nav,.no-print,.footer{display:none!important}.wrap{max-width:none;padding:0}.panel{box-shadow:none;border:0;padding:0}.doc{max-width:none}.table th{background:#0c2f59!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>

<body>
<header class="top"><h1>恆輝工程管理系統</h1><p>UNIBRIGHT CONSTRUCTION (H.K.) LIMITED · Quotation · Invoice · Receipt · Project</p></header>
<nav class="nav no-print" id="nav"><button class="active" data-tab="dashboard">Dashboard</button><button data-tab="projects">項目</button><button data-tab="quotation">報價單</button><button data-tab="invoice">Invoice</button><button data-tab="receipt">Receipt / 收款</button><button data-tab="pricing">價目表</button></nav>
<main class="wrap"><div id="app" class="loading">正在連接工程資料庫…</div></main><div class="footer">UNIBRIGHT 內部工程管理系統</div>
<script>
const BASE='https://bkjrzksoruhlzwrzpovw.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJranJ6a3NvcnVobHp3cnpwb3Z3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3Nzc2ODQsImV4cCI6MjEwMjM1MzY4NH0.RSoUlsO1ae8M6O7X62BgF42CnV2kMW7NtYR3ez1pPWU';
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};let D={summary:[],projects:[],clients:[],quotes:[],invoices:[],payments:[],pricing:[]},tab='dashboard',draft=[],tier='customer';const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=n=>Number(n||0);const hk=n=>'HK$'+num(n).toLocaleString('en-HK',{minimumFractionDigits:2,maximumFractionDigits:2});const today=()=>new Date().toISOString().slice(0,10);function gen(p){let d=today().replaceAll('-','').slice(2);return p+'/'+d+'/'+String(Date.now()).slice(-5)}
async function api(t,q='',o={}){let r=await fetch(BASE+'/rest/v1/'+t+q,{method:o.method||'GET',headers:{...H,Prefer:o.prefer||'return=representation'},body:o.body?JSON.stringify(o.body):undefined}),x=await r.text();if(!r.ok)throw Error(x||r.status);return x?JSON.parse(x):[]}
async function load(){try{let [s,p,c,q,i,pa,pc]=await Promise.all([api('project_financial_summary','?select=*&order=project_no'),api('projects','?select=*&order=created_at.desc'),api('clients','?select=*&order=created_at.desc'),api('quotations','?select=*&order=created_at.desc'),api('invoices','?select=*&order=created_at.desc'),api('payments','?select=*&order=payment_date.desc,created_at.desc'),api('pricing_catalog','?select=*&active=eq.true&order=price_tier,item_code')]);D={summary:s,projects:p,clients:c,quotes:q,invoices:i,payments:pa,pricing:pc};render()}catch(e){app.className='';app.innerHTML='<div class="notice"><b>資料庫連線失敗</b><br>'+esc(e.message)+'</div><button class="btn" onclick="load()">重新載入</button>'}}
function rawProject(id){return D.projects.find(x=>x.id===id)}function sumProject(id){return D.summary.find(x=>x.project_id===id)}function clientFor(pid){let p=rawProject(pid);return D.clients.find(c=>c.id===p?.client_id)}
function show(t){tab=t;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>show(b.dataset.tab));function render(){app.className='';({dashboard:dash,projects:projectHome,quotation:quoteHome,invoice:invoiceHome,receipt:receiptHome,pricing:pricingHome}[tab]||dash)()}
function projRows(){return D.projects.map(p=>{let s=sumProject(p.id)||{};return `<tr><td><b>${esc(p.project_no)}</b><br>${esc(p.project_name)}<br><small class="muted">${esc(p.site_address||'')}</small></td><td><span class="pill">${esc(p.status)}</span></td><td style="min-width:140px">${num(p.progress_percent)}%<div class="progress"><i style="width:${Math.min(100,num(p.progress_percent))}%"></i></div></td><td>${hk(p.contract_amount)}</td><td>${hk(s.received_amount)}</td><td class="money">${hk(s.outstanding_amount??p.contract_amount)}</td><td class="no-print"><button class="btn sm light" onclick="editProgress('${p.id}')">更新</button></td></tr>`}).join('')}
function dash(){let x=D.summary.reduce((a,p)=>{a.c+=num(p.contract_amount);a.r+=num(p.received_amount);a.o+=num(p.outstanding_amount);return a},{c:0,r:0,o:0});app.innerHTML=`<div class="cards"><div class="card"><span>項目數量</span><b>${D.projects.length}</b></div><div class="card"><span>合約總額</span><b>${hk(x.c)}</b></div><div class="card"><span>已收款</span><b>${hk(x.r)}</b></div><div class="card"><span>尚欠</span><b class="red">${hk(x.o)}</b></div></div><div class="panel"><div class="row space"><div><h2>項目進度及收款</h2><span class="muted">工程、合約額、已收及尚欠一頁睇晒。</span></div><div class="row no-print"><button class="btn green" onclick="newProject()">＋ 新項目</button><button class="btn" onclick="newQuote()">＋ 新報價</button></div></div><div class="tablewrap"><table class="table"><tr><th>項目</th><th>狀態</th><th>進度</th><th>合約額</th><th>已收</th><th>尚欠</th><th></th></tr>${projRows()}</table></div></div>`}
function projectHome(){app.innerHTML=`<div class="panel"><div class="row space"><div><h2>項目管理</h2><span class="muted">項目名稱唔固定，可以隨時新增。</span></div><button class="btn green no-print" onclick="newProject()">＋ 新項目</button></div><div class="tablewrap"><table class="table"><tr><th>項目</th><th>狀態</th><th>進度</th><th>合約額</th><th>已收</th><th>尚欠</th><th></th></tr>${projRows()}</table></div></div>`}
async function editProgress(id){let p=rawProject(id),pct=prompt('工程進度 0–100',p.progress_percent);if(pct===null)return;pct=Math.max(0,Math.min(100,num(pct)));let st=prompt('狀態：報價中／已確認／施工中／待收款／已完成',p.status)||p.status,n=prompt('進度備註（可留空）','')||'';try{await api('projects','?id=eq.'+id,{method:'PATCH',body:{progress_percent:pct,status:st}});await api('project_progress','',{method:'POST',body:{project_id:id,progress_percent:pct,status:st,update_note:n}});await load()}catch(e){alert(e.message)}}
function newProject(){app.innerHTML=`<div class="panel"><div class="row space"><h2>建立新項目</h2><button class="btn light" onclick="projectHome()">返回</button></div>${newProjectFields('np')}<button class="btn green no-print" onclick="saveStandaloneProject()">儲存項目</button></div>`}
function newProjectFields(p){return `<div class="newbox"><h3>新工程資料</h3><div class="grid2"><div><div class="field"><label>公司／客戶名稱</label><input id="${p}cname" class="wide"></div><div class="field"><label>聯絡人</label><input id="${p}contact" class="wide"></div><div class="field"><label>電話</label><input id="${p}phone" class="wide"></div><div class="field"><label>Email</label><input id="${p}email" class="wide"></div><div class="field"><label>客戶地址</label><textarea id="${p}caddr" class="wide"></textarea></div></div><div><div class="field"><label>項目編號</label><input id="${p}pno" class="wide" value="PRJ-${today().replaceAll('-','')}-${String(Date.now()).slice(-4)}"></div><div class="field"><label>工程／項目名稱</label><input id="${p}pname" class="wide" placeholder="例如：旺角XX大廈簡樸房整改"></div><div class="field"><label>施工地址</label><textarea id="${p}site" class="wide"></textarea></div></div></div></div>`}
async function createProjectFromFields(p){let g=id=>document.getElementById(p+id)?.value.trim()||'',cn=g('cname'),pn=g('pname');if(!cn||!pn)throw Error('請填公司／客戶名稱及工程名稱');let c=await api('clients','',{method:'POST',body:{company_name:cn,contact_name:g('contact'),phone:g('phone'),email:g('email'),address:g('caddr')}}),pr=await api('projects','',{method:'POST',body:{project_no:g('pno')||('PRJ-'+Date.now()),client_id:c[0].id,project_name:pn,site_address:g('site'),status:'報價中',progress_percent:0,contract_amount:0}});return pr[0]}
async function saveStandaloneProject(){try{await createProjectFromFields('np');tab='projects';await load()}catch(e){alert('儲存失敗：'+e.message)}}
function quoteHome(){app.innerHTML=`<div class="panel"><div class="row space"><div><h2>報價單 Quotation</h2><span class="muted">可揀現有工程，亦可開報價時直接輸入新工程。</span></div><button class="btn no-print" onclick="newQuote()">＋ 建立報價</button></div><div class="tablewrap"><table class="table"><tr><th>報價編號</th><th>類別</th><th>日期</th><th>狀態</th><th>總額</th><th></th></tr>${D.quotes.map(q=>`<tr><td>${esc(q.quotation_no)}</td><td><span class="pill">${q.price_tier==='trade'?'同行價':'客戶價'}</span></td><td>${esc(q.issue_date)}</td><td>${esc(q.status)}</td><td class="money">${hk(q.total)}</td><td><div class="row"><button class="btn sm light" onclick="viewQuote('${q.id}')">查看</button>${q.status!=='已轉Invoice'?`<button class="btn sm green" onclick="convertInvoice('${q.id}')">轉 Invoice</button>`:''}</div></td></tr>`).join('')}</table></div></div>`}
function newQuote(){tab='quotation';tier='customer';draft=[{description:'',unit:'項',quantity:1,unit_price:0}];drawQuoteEditor()}
function projectOptions(){return `<option value="__new__">＋ 新工程／自行輸入名稱</option>`+D.projects.map(p=>`<option value="${p.id}">${esc(p.project_no)}｜${esc(p.project_name)}</option>`).join('')}
function drawQuoteEditor(){app.innerHTML=`<div class="panel"><div class="row space"><div><h2>建立報價</h2><span class="muted">工程名稱唔固定。可揀現有項目，或者即場新增。</span></div><button class="btn light no-print" onclick="quoteHome()">返回</button></div><div class="tier no-print"><button id="tc" class="on" onclick="setTier('customer')">客戶價</button><button id="tt" onclick="setTier('trade')">同行價</button></div><div style="margin-top:13px" class="field"><label>工程／項目</label><select id="qproj" class="wide" onchange="toggleNewProject()">${projectOptions()}</select></div><div id="quoteNewProject">${newProjectFields('q')}</div><div class="grid2" style="margin-top:12px"><div><div class="field"><label>折扣</label><div class="row"><select id="dtype" onchange="calc()"><option value="percent">百分比 %</option><option value="fixed">固定金額 HK$</option></select><input id="dval" type="number" value="0" min="0" oninput="calc()"></div></div><div id="plans" class="planbar no-print"><span class="muted">房數</span><input id="rooms" type="number" min="1" value="3" style="width:75px"><button onclick="applyPlan(1)">PLAN 1</button><button onclick="applyPlan(2)">PLAN 2</button><button onclick="applyPlan(3)">PLAN 3</button></div></div><div><div class="row space"><b id="catalogTitle">客戶標準價目</b><button class="btn sm light no-print" onclick="addBlank()">＋ 自訂項目</button></div><div id="catalog" class="catalog no-print"></div></div></div><div id="items" style="margin-top:14px"></div><div class="totalbox"><div><span>小計 Subtotal</span><b id="subtotal"></b></div><div><span>折扣 Discount</span><b id="discount"></b></div><div class="grand"><span>總額 Total</span><b id="total"></b></div></div><div class="row no-print" style="margin-top:14px"><button class="btn green" onclick="saveQuote()">儲存報價</button><button class="btn gold" onclick="window.print()">列印／PDF</button></div></div>`;drawCatalog();drawItems();toggleNewProject()}
function toggleNewProject(){let n=document.getElementById('quoteNewProject'),v=document.getElementById('qproj')?.value;if(n)n.classList.toggle('hide',v!=='__new__')}
function setTier(t){tier=t;tc.classList.toggle('on',t==='customer');tt.classList.toggle('on',t==='trade');plans.classList.toggle('hide',t!=='customer');catalogTitle.textContent=t==='customer'?'客戶標準價目':'同行合作價目';draft=[];drawCatalog();drawItems()}
function drawCatalog(){catalog.innerHTML=D.pricing.filter(x=>x.price_tier===tier).map(x=>`<div class="catalog-item"><div><b>${esc(x.description)}</b><small>${hk(x.unit_price)}／${esc(x.unit)} · ${esc(x.pricing_rule||'')}</small>${x.inclusions?`<small><br>包括：${esc(x.inclusions)}</small>`:''}${x.exclusions?`<small><br>不包括：${esc(x.exclusions)}</small>`:''}</div><button class="btn sm" onclick="pick('${x.item_code}')">加入</button></div>`).join('')}
function pick(code){let x=D.pricing.find(v=>v.item_code===code);if(x)draft.push({description:x.description,unit:x.unit,quantity:1,unit_price:num(x.unit_price)});drawItems()}function addBlank(){draft.push({description:'',unit:'項',quantity:1,unit_price:0});drawItems()}function qchg(i,d){draft[i].quantity=Math.max(0,num(draft[i].quantity)+d);drawItems()}function qdel(i){draft.splice(i,1);drawItems()}
function applyPlan(plan){let rooms=Math.max(1,num(document.getElementById('rooms').value)),max=plan===1?7:plan===2?12:18;draft=D.pricing.filter(x=>x.price_tier==='customer'&&num(x.item_code.split('-')[1])<=max).map(x=>({description:x.description,unit:x.unit,quantity:(['CUS-04','CUS-06'].includes(x.item_code)?rooms+1:['CUS-05','CUS-09','CUS-16'].includes(x.item_code)?1:rooms),unit_price:num(x.unit_price)}));drawItems()}
function drawItems(){if(!document.getElementById('items'))return;items.innerHTML=`<div class="tablewrap"><table class="table"><tr><th>工程項目</th><th>單位</th><th>數量</th><th>單價</th><th>小計</th><th class="no-print"></th></tr>${draft.map((x,i)=>`<tr><td><input class="wide" value="${esc(x.description)}" oninput="draft[${i}].description=this.value"></td><td><input style="width:90px" value="${esc(x.unit)}" oninput="draft[${i}].unit=this.value"></td><td><div class="qty"><button class="no-print" onclick="qchg(${i},-1)">−</button><input type="number" min="0" value="${x.quantity}" oninput="draft[${i}].quantity=num(this.value);calc()"><button class="no-print" onclick="qchg(${i},1)">＋</button></div></td><td><input type="number" min="0" value="${x.unit_price}" oninput="draft[${i}].unit_price=num(this.value);calc()"></td><td id="line${i}" class="money">${hk(num(x.quantity)*num(x.unit_price))}</td><td class="no-print"><button class="btn sm red" onclick="qdel(${i})">刪除</button></td></tr>`).join('')}</table></div>`;calc()}
function calc(){let s=draft.reduce((a,x)=>a+num(x.quantity)*num(x.unit_price),0),v=num(document.getElementById('dval')?.value),type=document.getElementById('dtype')?.value||'percent',d=type==='percent'?s*v/100:Math.min(s,v),t=Math.max(0,s-d);draft.forEach((x,i)=>{let e=document.getElementById('line'+i);if(e)e.textContent=hk(num(x.quantity)*num(x.unit_price))});if(document.getElementById('subtotal')){subtotal.textContent=hk(s);discount.textContent=hk(d);total.textContent=hk(t)}return{subtotal:s,discount:d,total:t,type,value:v}}
async function saveQuote(){let clean=draft.filter(x=>x.description.trim()&&num(x.quantity)>0);if(!clean.length){alert('請加入至少一個工程項目');return}try{let pid=qproj.value;if(pid==='__new__'){let p=await createProjectFromFields('q');pid=p.id}let c=calc(),no=gen(tier==='trade'?'TQ':'QO'),qv=await api('quotations','',{method:'POST',body:{quotation_no:no,project_id:pid,discount_type:c.type,discount_value:c.value,subtotal:c.subtotal,discount_amount:c.discount,total:c.total,status:'草稿',price_tier:tier}});await api('quotation_items','',{method:'POST',body:clean.map((x,i)=>({quotation_id:qv[0].id,sort_order:i+1,description:x.description,unit:x.unit,quantity:x.quantity,unit_price:x.unit_price,amount:num(x.quantity)*num(x.unit_price)}))});alert('已儲存：'+no);await load();tab='quotation';render()}catch(e){alert('儲存失敗：'+e.message)}}
function docHTML(title,no,date,pid,its,sub,dis,tot,extra=''){let p=rawProject(pid),c=clientFor(pid);return `<div class="panel doc"><div class="dochead"><div><h2>恆輝建築（香港）有限公司</h2><div>UNIBRIGHT CONSTRUCTION (H.K.) LIMITED</div></div><div><h2>${title}</h2><div class="meta">No. ${esc(no)}<br>日期：${esc(date)}</div></div></div><div class="grid2 meta"><div><b>客戶 BILL TO</b><br>${esc(c?.company_name||'')}<br>${esc(c?.contact_name||'')} ${esc(c?.phone||'')}<br>${esc(c?.email||'')}<br>${esc(c?.address||'')}</div><div><b>工程 PROJECT</b><br>${esc(p?.project_no||'')}<br>${esc(p?.project_name||'')}<br>${esc(p?.site_address||'')}</div></div><div class="tablewrap" style="margin-top:15px"><table class="table"><tr><th>工程項目</th><th>單位</th><th>數量</th><th>單價</th><th>金額</th></tr>${its.map(x=>`<tr><td>${esc(x.description)}</td><td>${esc(x.unit)}</td><td>${num(x.quantity)}</td><td>${hk(x.unit_price)}</td><td class="money">${hk(x.amount)}</td></tr>`).join('')}</table></div><div class="totalbox"><div><span>小計</span><b>${hk(sub)}</b></div><div><span>折扣</span><b>${hk(dis)}</b></div><div class="grand"><span>總額</span><b>${hk(tot)}</b></div></div><div class="meta" style="margin-top:18px"><b>收款資料</b><br>中國工商銀行（亞洲）有限公司：720502009151<br>轉數快 FPS：120437801</div>${extra}</div>`}
async function viewQuote(id){try{let q=D.quotes.find(x=>x.id===id),it=await api('quotation_items','?quotation_id=eq.'+id+'&select=*&order=sort_order');app.innerHTML=docHTML('QUOTATION 報價單',q.quotation_no,q.issue_date,q.project_id,it,q.subtotal,q.discount_amount,q.total,`<div class="row no-print" style="margin-top:15px"><button class="btn light" onclick="quoteHome()">返回</button><button class="btn gold" onclick="window.print()">列印／PDF</button>${q.status!=='已轉Invoice'?`<button class="btn green" onclick="convertInvoice('${id}')">轉 Invoice</button>`:''}</div>`)}catch(e){alert(e.message)}}
async function convertInvoice(qid){if(!confirm('將呢張報價轉成 Invoice？'))return;try{let q=D.quotes.find(x=>x.id===qid),its=await api('quotation_items','?quotation_id=eq.'+qid+'&select=*&order=sort_order'),no=gen('INV'),iv=await api('invoices','',{method:'POST',body:{invoice_no:no,project_id:q.project_id,quotation_id:qid,subtotal:q.subtotal,discount_amount:q.discount_amount,total:q.total,amount_paid:0,amount_due:q.total,status:'未付款',notes:'由報價 '+q.quotation_no+' 轉入'}});await api('invoice_items','',{method:'POST',body:its.map((x,i)=>({invoice_id:iv[0].id,sort_order:i+1,description:x.description,unit:x.unit,quantity:x.quantity,unit_price:x.unit_price,amount:x.amount}))});await api('quotations','?id=eq.'+qid,{method:'PATCH',body:{status:'已轉Invoice'}});await api('projects','?id=eq.'+q.project_id,{method:'PATCH',body:{contract_amount:q.total,status:'已確認'}});alert('Invoice 已建立：'+no);await load();tab='invoice';render()}catch(e){alert(e.message)}}
function invoiceHome(){app.innerHTML=`<div class="panel"><h2>Invoice</h2><div class="tablewrap"><table class="table"><tr><th>Invoice No.</th><th>日期</th><th>狀態</th><th>總額</th><th>已收</th><th>尚欠</th><th></th></tr>${D.invoices.map(x=>`<tr><td>${esc(x.invoice_no)}</td><td>${esc(x.issue_date)}</td><td>${esc(x.status)}</td><td>${hk(x.total)}</td><td>${hk(x.amount_paid)}</td><td class="money">${hk(x.amount_due)}</td><td><div class="row"><button class="btn sm light" onclick="viewInvoice('${x.id}')">查看</button>${num(x.amount_due)>0?`<button class="btn sm green" onclick="takePayment('${x.id}')">收款</button>`:''}</div></td></tr>`).join('')}</table></div></div>`}
async function viewInvoice(id){let x=D.invoices.find(v=>v.id===id),it=await api('invoice_items','?invoice_id=eq.'+id+'&select=*&order=sort_order');app.innerHTML=docHTML('INVOICE 付款通知單',x.invoice_no,x.issue_date,x.project_id,it,x.subtotal,x.discount_amount,x.total,`<div class="notice" style="margin-top:15px"><b>已收：${hk(x.amount_paid)}　尚欠：${hk(x.amount_due)}</b></div><div class="row no-print"><button class="btn light" onclick="invoiceHome()">返回</button><button class="btn gold" onclick="window.print()">列印／PDF</button>${num(x.amount_due)>0?`<button class="btn green" onclick="takePayment('${id}')">登記收款</button>`:''}</div>`)}
async function takePayment(id){let x=D.invoices.find(v=>v.id===id),a=prompt('本次收款金額（尚欠 '+hk(x.amount_due)+'）',String(x.amount_due));if(a===null)return;a=num(a);if(a<=0||a>num(x.amount_due)+.001){alert('收款金額不正確');return}let m=prompt('收款方式：FPS／銀行轉帳／支票／現金','FPS')||'FPS',r=prompt('交易／支票參考編號（可留空）','')||'',n=prompt('備註（可留空）','')||'',rc=gen('RCP');try{await api('payments','',{method:'POST',body:{project_id:x.project_id,invoice_id:id,receipt_no:rc,payment_date:today(),amount:a,method:m,reference_no:r,remarks:n}});alert('收款已登記，Receipt：'+rc);await load();tab='receipt';render()}catch(e){alert(e.message)}}
function receiptHome(){app.innerHTML=`<div class="panel"><h2>Receipt / 收款紀錄</h2><div class="tablewrap"><table class="table"><tr><th>Receipt No.</th><th>日期</th><th>金額</th><th>方式</th><th>參考編號</th><th></th></tr>${D.payments.map(x=>`<tr><td>${esc(x.receipt_no||'-')}</td><td>${esc(x.payment_date)}</td><td class="money">${hk(x.amount)}</td><td>${esc(x.method||'-')}</td><td>${esc(x.reference_no||'-')}</td><td><button class="btn sm light" onclick="viewReceipt('${x.id}')">收據</button></td></tr>`).join('')}</table></div></div>`}
function viewReceipt(id){let x=D.payments.find(v=>v.id===id),iv=D.invoices.find(v=>v.id===x.invoice_id),p=rawProject(x.project_id),c=clientFor(x.project_id);app.innerHTML=`<div class="panel doc"><div class="dochead"><div><h2>恆輝建築（香港）有限公司</h2><div>UNIBRIGHT CONSTRUCTION (H.K.) LIMITED</div></div><div><h2>RECEIPT 收據</h2><div class="meta">No. ${esc(x.receipt_no||'')}<br>日期：${esc(x.payment_date)}</div></div></div><div class="grid2 meta"><div><b>收到 FROM</b><br>${esc(c?.company_name||'')}<br>${esc(c?.contact_name||'')} ${esc(c?.phone||'')}</div><div><b>工程 PROJECT</b><br>${esc(p?.project_no||'')}<br>${esc(p?.project_name||'')}<br>Invoice：${esc(iv?.invoice_no||'')}</div></div><div style="margin:28px 0;padding:20px;border:2px solid var(--navy);border-radius:12px;text-align:center"><span class="muted">本次收款 AMOUNT RECEIVED</span><div style="font-size:34px;font-weight:900;color:var(--red)">${hk(x.amount)}</div><div>${esc(x.method||'')} ${x.reference_no?'｜'+esc(x.reference_no):''}</div></div><div class="row no-print"><button class="btn light" onclick="receiptHome()">返回</button><button class="btn gold" onclick="window.print()">列印／PDF</button></div></div>`}
function pricingHome(){let rows=a=>a.map(x=>`<tr><td>${esc(x.item_code)}</td><td>${esc(x.description)}${x.inclusions?`<br><small class="muted">包括：${esc(x.inclusions)}</small>`:''}${x.exclusions?`<br><small class="muted">不包括：${esc(x.exclusions)}</small>`:''}</td><td>${esc(x.unit)}</td><td class="money">${hk(x.unit_price)}</td><td>${esc(x.pricing_rule||'')}</td></tr>`).join('');app.innerHTML=`<div class="panel"><h2>客戶價目</h2><div class="tablewrap"><table class="table"><tr><th>編號</th><th>項目</th><th>單位</th><th>單價</th><th>計價</th></tr>${rows(D.pricing.filter(x=>x.price_tier==='customer'))}</table></div></div><div class="panel"><h2>同行合作價</h2><div class="tablewrap"><table class="table"><tr><th>編號</th><th>項目</th><th>單位</th><th>單價</th><th>計價</th></tr>${rows(D.pricing.filter(x=>x.price_tier==='trade'))}</table></div></div>`}
load();
</script>
</body></html>
