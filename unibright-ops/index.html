<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c2f59">
<title>恆輝工程管理系統｜UNIBRIGHT</title>
<style>
:root{--navy:#0c2f59;--green:#153d34;--gold:#b08a3a;--red:#b42318;--bg:#f5f6f4;--line:#d9dfdc;--muted:#6d7772;--white:#fff;--ink:#17211d}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Microsoft JhengHei",Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.top{background:linear-gradient(120deg,var(--navy),#123f70);color:#fff;padding:20px 22px}.top h1{margin:0;font-size:25px}.top p{margin:4px 0 0;opacity:.82;font-size:13px}.nav{display:flex;gap:7px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);overflow:auto;position:sticky;top:0;z-index:20}.nav button{white-space:nowrap;border:0;border-radius:9px;padding:10px 13px;font-weight:750;background:#edf1f5;color:var(--navy);cursor:pointer}.nav button.active{background:var(--navy);color:#fff}.wrap{max-width:1240px;margin:auto;padding:16px}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px #00000008}.panel{padding:16px;margin-bottom:14px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{padding:15px}.card span{font-size:13px;color:var(--muted)}.card b{display:block;margin-top:5px;font-size:24px;color:var(--navy)}.card b.red{color:var(--red)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:750;background:var(--navy);color:#fff;cursor:pointer}.btn.gold{background:var(--gold)}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.light{background:#edf1f5;color:var(--navy)}.btn.sm{padding:7px 10px;font-size:13px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:14px}.table th{background:var(--navy);color:#fff}.table th,.table td{border:1px solid var(--line);padding:9px;vertical-align:top}.table td.money{font-weight:800;color:var(--red);white-space:nowrap}.muted{color:var(--muted)}.pill{display:inline-block;border-radius:999px;background:#edf3f0;padding:5px 9px;font-size:12px;font-weight:700}.progress{height:9px;background:#e8ecea;border-radius:9px;overflow:hidden;margin-top:5px}.progress i{display:block;height:100%;background:var(--navy)}input,select,textarea{border:1px solid #cbd3cf;border-radius:8px;padding:9px;background:#fff;color:var(--ink)}input.wide,textarea.wide,select.wide{width:100%}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.form .field{margin-bottom:9px}.qty{display:flex;gap:5px;align-items:center}.qty button{width:34px;height:34px;border:1px solid #bcc7c2;background:#fff;border-radius:7px;font-size:19px}.qty input{width:78px;text-align:center}.totalbox{margin-left:auto;max-width:430px;margin-top:12px}.totalbox div{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee}.totalbox .grand{font-size:20px;font-weight:850;color:var(--red)}.tier{display:flex;gap:8px}.tier button{flex:1;padding:13px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:800}.tier button.on{background:var(--navy);color:#fff}.catalog{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:10px}.catalog-item{padding:10px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:10px}.catalog-item:last-child{border-bottom:0}.catalog-item b{display:block}.catalog-item small{color:var(--muted)}.planbar{display:flex;gap:8px;flex-wrap:wrap}.planbar button{border:1px solid var(--gold);background:#fff7e6;color:#684f16;border-radius:9px;padding:9px 12px;font-weight:800}.doc{background:#fff;max-width:900px;margin:auto}.dochead{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid var(--navy);padding-bottom:12px;margin-bottom:14px}.dochead h2{margin:0;color:var(--navy)}.doc .meta{font-size:13px;line-height:1.6}.notice{background:#fff5d9;border:1px solid #ead28e;border-radius:10px;padding:10px 12px;margin-bottom:12px}.hide{display:none!important}.loading{padding:28px;text-align:center;color:var(--muted)}.footer{font-size:12px;color:var(--muted);text-align:center;padding:16px}.kpi-label{font-size:12px;color:var(--muted)}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.wrap{padding:10px}.top{padding:16px}.top h1{font-size:21px}.table{font-size:12px}.desktop{display:none}.dochead{display:block}.catalog-item{grid-template-columns:1fr}.btn{padding:9px 11px}.nav{padding:8px}}@media print{body{background:#fff}.top,.nav,.no-print,.footer{display:none!important}.wrap{max-width:none;padding:0}.panel{box-shadow:none;border:0;padding:0}.doc{max-width:none}.table th{background:#0c2f59!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.table td,.table th{font-size:12px}.pagebreak{page-break-before:always}}
</style>
</head>
<body>
<header class="top"><h1>恆輝工程管理系統</h1><p>UNIBRIGHT CONSTRUCTION (H.K.) LIMITED · Quotation · Invoice · Receipt · Project</p></header>
<nav class="nav no-print" id="nav">
<button class="active" data-tab="dashboard">Dashboard</button><button data-tab="projects">項目</button><button data-tab="quotation">報價單</button><button data-tab="invoice">Invoice</button><button data-tab="receipt">Receipt / 收款</button><button data-tab="pricing">價目表</button>
</nav>
<main class="wrap"><div id="app" class="loading">正在連接工程資料庫…</div></main><div class="footer">內部工程管理系統 · 資料會直接儲存至公司資料庫</div>
<script>
const BASE='https://bkjrzksoruhlzwrzpovw.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJranJ6a3NvcnVobHp3cnpwb3Z3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3Nzc2ODQsImV4cCI6MjEwMjM1MzY4NH0.RSoUlsO1ae8M6O7X62BgF42CnV2kMW7NtYR3ez1pPWU';
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
let D={projects:[],clients:[],quotes:[],invoices:[],payments:[],pricing:[]}, tab='dashboard', draft=[],tier='customer';
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hk=n=>'HK$'+Number(n||0).toLocaleString('en-HK',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
const num=n=>Number(n||0);
function gen(prefix){let d=new Date(),y=String(d.getFullYear()).slice(-2),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return prefix+'/'+y+m+day+'/'+String(Date.now()).slice(-5)}
async function api(table,query='',opt={}){let r=await fetch(BASE+'/rest/v1/'+table+query,{method:opt.method||'GET',headers:{...H,Prefer:opt.prefer||'return=representation'},body:opt.body?JSON.stringify(opt.body):undefined});let text=await r.text();if(!r.ok)throw new Error(text||('HTTP '+r.status));return text?JSON.parse(text):[]}
async function load(){try{let [p,c,q,i,pa,pc]=await Promise.all([api('project_financial_summary','?select=*&order=project_no'),api('clients','?select=*&order=created_at.desc'),api('quotations','?select=*&order=created_at.desc'),api('invoices','?select=*&order=created_at.desc'),api('payments','?select=*&order=payment_date.desc,created_at.desc'),api('pricing_catalog','?select=*&active=eq.true&order=price_tier,item_code')]);D={projects:p,clients:c,quotes:q,invoices:i,payments:pa,pricing:pc};render()}catch(e){app.innerHTML='<div class="notice"><b>資料庫連線失敗</b><br><small>'+esc(e.message)+'</small></div><button class="btn" onclick="load()">重新載入</button>'}}
function show(t){tab=t;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>show(b.dataset.tab));
function render(){app.className='';if(tab==='dashboard')dash();if(tab==='projects')projects();if(tab==='quotation')quoteHome();if(tab==='invoice')invoiceHome();if(tab==='receipt')receiptHome();if(tab==='pricing')pricingHome()}
function summary(){return D.projects.reduce((a,p)=>{a.contract+=num(p.contract_amount);a.received+=num(p.received_amount);a.out+=num(p.outstanding_amount);return a},{contract:0,received:0,out:0})}
function projRows(){return D.projects.map(p=>`<tr><td><b>${esc(p.project_no)}</b><br>${esc(p.project_name)}<br><small class="muted">${esc(p.site_address||'')}</small></td><td><span class="pill">${esc(p.status)}</span></td><td style="min-width:150px">${num(p.progress_percent)}%<div class="progress"><i style="width:${Math.min(100,num(p.progress_percent))}%"></i></div></td><td>${hk(p.contract_amount)}</td><td>${hk(p.received_amount)}</td><td class="money">${hk(p.outstanding_amount)}</td><td class="no-print"><button class="btn sm light" onclick="editProgress('${p.project_id}')">更新</button></td></tr>`).join('')}
function dash(){let s=summary();app.innerHTML=`<div class="cards"><div class="card"><span>項目數量</span><b>${D.projects.length}</b></div><div class="card"><span>合約總額</span><b>${hk(s.contract)}</b></div><div class="card"><span>已收款</span><b>${hk(s.received)}</b></div><div class="card"><span>尚欠</span><b class="red">${hk(s.out)}</b></div></div><div class="panel"><div class="row space"><div><h2>項目進度及收款</h2><span class="muted">一眼睇到做到邊、收咗幾多、仲欠幾多。</span></div><div class="row no-print"><button class="btn green" onclick="newProject()">＋ 新項目</button><button class="btn" onclick="newQuote()">＋ 新報價</button><button class="btn light" onclick="load()">重新整理</button></div></div><div class="tablewrap"><table class="table"><tr><th>項目</th><th>狀態</th><th>進度</th><th>合約額</th><th>已收</th><th>尚欠</th><th></th></tr>${projRows()}</table></div></div>`}
function projects(){app.innerHTML=`<div class="panel"><div class="row space"><div><h2>項目管理</h2><span class="muted">更新工程進度、狀態及新增項目。</span></div><button class="btn green no-print" onclick="newProject()">＋ 新項目</button></div><div class="tablewrap"><table class="table"><tr><th>項目</th><th>狀態</th><th>進度</th><th>合約額</th><th>已收</th><th>尚欠</th><th></th></tr>${projRows()}</table></div></div>`}
async function editProgress(id){let p=D.projects.find(x=>x.project_id===id),pct=prompt('工程進度 0–100',p.progress_percent);if(pct===null)return;pct=Math.max(0,Math.min(100,num(pct)));let st=prompt('狀態：報價中／已確認／施工中／待收款／已完成',p.status)||p.status,note=prompt('進度備註（可留空）','')||'';try{await api('projects','?id=eq.'+id,{method:'PATCH',body:{progress_percent:pct,status:st}});await api('project_progress','',{method:'POST',body:{project_id:id,progress_percent:pct,status:st,update_note:note}});await load()}catch(e){alert('更新失敗：'+e.message)}}
function newProject(){app.innerHTML=`<div class="panel form"><div class="row space"><h2>建立新項目</h2><button class="btn light no-print" onclick="projects();tab='projects'">返回</button></div><div class="grid2"><div><h3>客戶資料</h3><div class="field"><label>公司／客戶名稱</label><input id="cname" class="wide"></div><div class="field"><label>聯絡人</label><input id="contact" class="wide"></div><div class="field"><label>電話</label><input id="phone" class="wide"></div><div class="field"><label>Email</label><input id="email" class="wide"></div><div class="field"><label>客戶地址</label><textarea id="caddr" class="wide"></textarea></div></div><div><h3>工程資料</h3><div class="field"><label>項目編號</label><input id="pno" class="wide" value="PRJ-${today().replaceAll('-','')}-${String(Date.now()).slice(-4)}"></div><div class="field"><label>項目名稱</label><input id="pname" class="wide"></div><div class="field"><label>施工地址</label><textarea id="site" class="wide"></textarea></div><div class="field"><label>狀態</label><select id="pstatus" class="wide"><option>報價中</option><option>已確認</option><option>施工中</option><option>待收款</option><option>已完成</option></select></div></div></div><button class="btn green no-print" onclick="saveProject()">儲存項目</button></div>`}
async function saveProject(){if(!cname.value.trim()||!pname.value.trim()){alert('請填客戶名稱及項目名稱');return}try{let c=await api('clients','',{method:'POST',body:{company_name:cname.value.trim(),contact_name:contact.value.trim(),phone:phone.value.trim(),email:email.value.trim(),address:caddr.value.trim()}});await api('projects','',{method:'POST',body:{project_no:pno.value.trim(),client_id:c[0].id,project_name:pname.value.trim(),site_address:site.value.trim(),status:pstatus.value,progress_percent:0,contract_amount:0}});tab='projects';await load()}catch(e){alert('儲存失敗：'+e.message)}}
function quoteHome(){app.innerHTML=`<div class="panel"><div class="row space"><div><h2>報價單 Quotation</h2><span class="muted">客戶價及同行價完全分開。</span></div><button class="btn no-print" onclick="newQuote()">＋ 建立報價</button></div><div class="tablewrap"><table class="table"><tr><th>報價編號</th><th>類別</th><th>日期</th><th>狀態</th><th>總額</th><th></th></tr>${D.quotes.map(q=>`<tr><td>${esc(q.quotation_no)}</td><td><span class="pill">${q.price_tier==='trade'?'同行價':'客戶價'}</span></td><td>${esc(q.issue_date)}</td><td>${esc(q.status)}</td><td class="money">${hk(q.total)}</td><td><div class="row"><button class="btn sm light" onclick="viewQuote('${q.id}')">查看</button>${q.status!=='已轉Invoice'?`<button class="btn sm green" onclick="convertInvoice('${q.id}')">轉 Invoice</button>`:''}</div></td></tr>`).join('')}</table></div></div>`}
function newQuote(){tab='quotation';tier='customer';draft=[{description:'',unit:'項',quantity:1,unit_price:0}];drawQuoteEditor()}
function planQty(code,rooms){if(code==='CUS-04'||code==='CUS-06')return rooms+1;if(code==='CUS-05'||code==='CUS-09'||code==='CUS-16')return 1;return rooms}
function applyPlan(plan){let rooms=Math.max(1,num(document.getElementById('rooms').value||3)),max=plan===1?7:plan===2?12:18,items=D.pricing.filter(x=>x.price_tier==='customer'&&Number(x.item_code.split('-')[1])<=max);draft=items.map(x=>({description:x.description,unit:x.unit,quantity:planQty(x.item_code,rooms),unit_price:num(x.unit_price),note:x.pricing_rule||''}));drawItems()}
function drawQuoteEditor(){let projects=D.projects.map(p=>`<option value="${p.project_id}">${esc(p.project_no)}｜${esc(p.project_name)}</option>`).join('');app.innerHTML=`<div class="panel"><div class="row space"><div><h2>建立報價</h2><span class="muted">揀客戶價／同行價，再用＋／－改數量，即時計總數。</span></div><button class="btn light no-print" onclick="quoteHome()">返回</button></div><div class="tier no-print"><button id="tc" class="on" onclick="setTier('customer')">客戶價</button><button id="tt" onclick="setTier('trade')">同行價</button></div><div class="grid2" style="margin-top:12px"><div class="form"><div class="field"><label>工程項目</label><select id="qproj" class="wide">${projects}</select></div><div class="field"><label>折扣方式</label><div class="row"><select id="dtype" onchange="calc()"><option value="percent">百分比 %</option><option value="fixed">固定金額 HK$</option></select><input id="dval" type="number" value="0" min="0" oninput="calc()"></div></div><div id="plans" class="planbar no-print"><span class="kpi-label">房數</span><input id="rooms" type="number" min="1" value="3" style="width:80px"><button onclick="applyPlan(1)">PLAN 1 輕微整改</button><button onclick="applyPlan(2)">PLAN 2 中度整改</button><button onclick="applyPlan(3)">PLAN 3 大改重整</button></div></div><div><div class="row space"><b id="catalogTitle">客戶標準價目</b><button class="btn sm light no-print" onclick="addBlank()">＋ 自訂項目</button></div><div id="catalog" class="catalog no-print"></div></div></div><div id="items" style="margin-top:14px"></div><div class="totalbox"><div><span>小計 Subtotal</span><b id="subtotal"></b></div><div><span>折扣 Discount</span><b id="discount"></b></div><div class="grand"><span>總額 Total</span><b id="total"></b></div></div><div class="row no-print" style="margin-top:14px"><button class="btn green" onclick="saveQuote()">儲存報價</button><button class="btn gold" onclick="window.print()">列印／PDF</button></div></div>`;drawCatalog();drawItems()}
function setTier(t){tier=t;document.getElementById('tc').classList.toggle('on',t==='customer');document.getElementById('tt').classList.toggle('on',t==='trade');plans.classList.toggle('hide',t!=='customer');catalogTitle.textContent=t==='customer'?'客戶標準價目':'同行合作價目';draft=[];drawCatalog();drawItems()}
function drawCatalog(){let list=D.pricing.filter(x=>x.price_tier===tier);catalog.innerHTML=list.map((x,i)=>`<div class="catalog-item"><div><b>${esc(x.description)}</b><small>${hk(x.unit_price)}／${esc(x.unit)} · ${esc(x.pricing_rule||'')}</small>${x.inclusions?`<small><br>包括：${esc(x.inclusions)}</small>`:''}${x.exclusions?`<small><br>不包括：${esc(x.exclusions)}</small>`:''}</div><button class="btn sm" onclick="pick('${x.item_code}')">加入</button></div>`).join('')}
function pick(code){let x=D.pricing.find(v=>v.item_code===code);if(!x)return;let q=1;if(code==='TRD-W02')q=1;draft.push({description:x.description,unit:x.unit,quantity:q,unit_price:num(x.unit_price),note:[x.pricing_rule,x.inclusions,x.exclusions].filter(Boolean).join('；')});drawItems()}
function addBlank(){draft.push({description:'',unit:'項',quantity:1,unit_price:0});drawItems()}
function qchg(i,d){draft[i].quantity=Math.max(0,num(draft[i].quantity)+d);drawItems()}
function qdel(i){draft.splice(i,1);drawItems()}
function drawItems(){if(!document.getElementById('items'))return;items.innerHTML=`<div class="tablewrap"><table class="table"><tr><th>工程項目</th><th>單位</th><th>數量</th><th>單價</th><th>小計</th><th class="no-print"></th></tr>${draft.map((x,i)=>`<tr><td><input class="wide" value="${esc(x.description)}" oninput="draft[${i}].description=this.value"></td><td><input style="width:90px" value="${esc(x.unit)}" oninput="draft[${i}].unit=this.value"></td><td><div class="qty"><button class="no-print" onclick="qchg(${i},-1)">−</button><input type="number" min="0" value="${x.quantity}" oninput="draft[${i}].quantity=num(this.value);calc()"><button class="no-print" onclick="qchg(${i},1)">＋</button></div></td><td><input type="number" min="0" value="${x.unit_price}" oninput="draft[${i}].unit_price=num(this.value);calc()"></td><td id="line${i}" class="money">${hk(num(x.quantity)*num(x.unit_price))}</td><td class="no-print"><button class="btn sm red" onclick="qdel(${i})">刪除</button></td></tr>`).join('')}</table></div>`;calc()}
function calc(){let s=draft.reduce((a,x)=>a+num(x.quantity)*num(x.unit_price),0),v=num(document.getElementById('dval')?.value),type=document.getElementById('dtype')?.value||'percent',d=type==='percent'?s*v/100:Math.min(s,v),t=Math.max(0,s-d);draft.forEach((x,i)=>{let e=document.getElementById('line'+i);if(e)e.textContent=hk(num(x.quantity)*num(x.unit_price))});if(document.getElementById('subtotal')){subtotal.textContent=hk(s);discount.textContent=hk(d);total.textContent=hk(t)}return{subtotal:s,discount:d,total:t,type,value:v}}
async function saveQuote(){if(!qproj.value){alert('請先建立／選擇工程項目');return}let clean=draft.filter(x=>x.description.trim()&&num(x.quantity)>0),c=calc();if(!clean.length){alert('請加入至少一個工程項目');return}try{let no=gen(tier==='trade'?'TQ':'QO');let q=await api('quotations','',{method:'POST',body:{quotation_no:no,project_id:qproj.value,discount_type:c.type,discount_value:c.value,subtotal:c.subtotal,discount_amount:c.discount,total:c.total,status:'草稿',price_tier:tier}});await api('quotation_items','',{method:'POST',body:clean.map((x,i)=>({quotation_id:q[0].id,sort_order:i+1,description:x.description,unit:x.unit,quantity:x.quantity,unit_price:x.unit_price,amount:num(x.quantity)*num(x.unit_price)}))});alert('已儲存：'+no);await load();tab='quotation';render()}catch(e){alert('儲存失敗：'+e.message)}}
async function viewQuote(id){try{let q=D.quotes.find(x=>x.id===id),it=await api('quotation_items','?quotation_id=eq.'+id+'&select=*&order=sort_order'),p=D.projects.find(x=>x.project_id===q.project_id);app.innerHTML=docHTML('QUOTATION 報價單',q.quotation_no,q.issue_date,p,it,q.subtotal,q.discount_amount,q.total,`<div class="row no-print"><button class="btn light" onclick="quoteHome()">返回</button><button class="btn gold" onclick="window.print()">列印／PDF</button>${q.status!=='已轉Invoice'?`<button class="btn green" onclick="convertInvoice('${id}')">轉 Invoice</button>`:''}</div>`)}catch(e){alert(e.message)}}
function clientForProject(p){return D.clients.find(c=>c.id===p?.client_id)}
function docHTML(title,no,date,p,items,sub,dis,totalv,actions=''){let c=clientForProject(p);return `<div class="panel doc"><div class="dochead"><div><h2>恆輝建築（香港）有限公司</h2><div>UNIBRIGHT CONSTRUCTION (H.K.) LIMITED</div></div><div><h2>${title}</h2><div class="meta">No. ${esc(no)}<br>日期：${esc(date)}</div></div></div><div class="grid2"><div class="meta"><b>客戶 BILL TO</b><br>${esc(c?.company_name||'')}<br>${esc(c?.contact_name||'')} ${esc(c?.phone||'')}<br>${esc(c?.email||'')}<br>${esc(c?.address||'')}</div><div class="meta"><b>工程 PROJECT</b><br>${esc(p?.project_no||'')}<br>${esc(p?.project_name||'')}<br>${esc(p?.site_address||'')}</div></div><div class="tablewrap" style="margin-top:15px"><table class="table"><tr><th>工程項目</th><th>單位</th><th>數量</th><th>單價</th><th>金額</th></tr>${items.map(x=>`<tr><td>${esc(x.description)}</td><td>${esc(x.unit)}</td><td>${num(x.quantity)}</td><td>${hk(x.unit_price)}</td><td class="money">${hk(x.amount??num(x.quantity)*num(x.unit_price))}</td></tr>`).join('')}</table></div><div class="totalbox"><div><span>小計</span><b>${hk(sub)}</b></div><div><span>折扣</span><b>${hk(dis)}</b></div><div class="grand"><span>總額</span><b>${hk(totalv)}</b></div></div><div class="meta" style="margin-top:20px"><b>收款資料</b><br>中國工商銀行（亞洲）有限公司：720502009151<br>轉數快 FPS：120437801</div><div style="margin-top:14px">${actions}</div></div>`}
async function convertInvoice(qid){if(!confirm('將呢張報價轉成 Invoice？'))return;try{let q=D.quotes.find(x=>x.id===qid),its=await api('quotation_items','?quotation_id=eq.'+qid+'&select=*&order=sort_order'),no=gen('INV'),iv=await api('invoices','',{method:'POST',body:{invoice_no:no,project_id:q.project_id,quotation_id:qid,subtotal:q.subtotal,discount_amount:q.discount_amount,total:q.total,amount_paid:0,amount_due:q.total,status:'未付款',notes:'由報價 '+q.quotation_no+' 轉入'}});await api('invoice_items','',{method:'POST',body:its.map((x,i)=>({invoice_id:iv[0].id,sort_order:i+1,description:x.description,unit:x.unit,quantity:x.quantity,unit_price:x.unit_price,amount:x.amount}))});await api('quotations','?id=eq.'+qid,{method:'PATCH',body:{status:'已轉Invoice'}});await api('projects','?id=eq.'+q.project_id,{method:'PATCH',body:{contract_amount:q.total,status:'已確認'}});alert('Invoice 已建立：'+no);await load();tab='invoice';render()}catch(e){alert('轉 Invoice 失敗：'+e.message)}}
function invoiceHome(){app.innerHTML=`<div class="panel"><h2>Invoice</h2><div class="tablewrap"><table class="table"><tr><th>Invoice No.</th><th>日期</th><th>狀態</th><th>總額</th><th>已收</th><th>尚欠</th><th></th></tr>${D.invoices.map(x=>`<tr><td>${esc(x.invoice_no)}</td><td>${esc(x.issue_date)}</td><td><span class="pill">${esc(x.status)}</span></td><td>${hk(x.total)}</td><td>${hk(x.amount_paid)}</td><td class="money">${hk(x.amount_due)}</td><td><div class="row"><button class="btn sm light" onclick="viewInvoice('${x.id}')">查看</button>${num(x.amount_due)>0?`<button class="btn sm green" onclick="takePayment('${x.id}')">收款</button>`:''}</div></td></tr>`).join('')}</table></div></div>`}
async function viewInvoice(id){try{let x=D.invoices.find(v=>v.id===id),it=await api('invoice_items','?invoice_id=eq.'+id+'&select=*&order=sort_order'),p=D.projects.find(v=>v.project_id===x.project_id);app.innerHTML=docHTML('INVOICE 付款通知單',x.invoice_no,x.issue_date,p,it,x.subtotal,x.discount_amount,x.total,`<div class="notice"><b>已收：${hk(x.amount_paid)}　尚欠：${hk(x.amount_due)}</b></div><div class="row no-print"><button class="btn light" onclick="invoiceHome()">返回</button><button class="btn gold" onclick="window.print()">列印／PDF</button>${num(x.amount_due)>0?`<button class="btn green" onclick="takePayment('${id}')">登記收款</button>`:''}</div>`)}catch(e){alert(e.message)}}
async function takePayment(id){let x=D.invoices.find(v=>v.id===id),amt=prompt('本次收款金額（尚欠 '+hk(x.amount_due)+'）',String(x.amount_due));if(amt===null)return;amt=num(amt);if(amt<=0||amt>num(x.amount_due)+0.001){alert('收款金額不正確');return}let method=prompt('收款方式：FPS／銀行轉帳／支票／現金','FPS')||'FPS',ref=prompt('交易／支票參考編號（可留空）','')||'',remarks=prompt('備註（可留空）','')||'',receipt=gen('RCP');try{await api('payments','',{method:'POST',body:{project_id:x.project_id,invoice_id:id,receipt_no:receipt,payment_date:today(),amount:amt,method,reference_no:ref,remarks}});alert('收款已登記，Receipt：'+receipt);await load();tab='receipt';render()}catch(e){alert('收款失敗：'+e.message)}}
function receiptHome(){app.innerHTML=`<div class="panel"><h2>Receipt / 收款紀錄</h2><div class="tablewrap"><table class="table"><tr><th>Receipt No.</th><th>日期</th><th>金額</th><th>方式</th><th>參考編號</th><th></th></tr>${D.payments.map(x=>`<tr><td>${esc(x.receipt_no||'-')}</td><td>${esc(x.payment_date)}</td><td class="money">${hk(x.amount)}</td><td>${esc(x.method||'-')}</td><td>${esc(x.reference_no||'-')}</td><td><button class="btn sm light" onclick="viewReceipt('${x.id}')">收據</button></td></tr>`).join('')}</table></div></div>`}
function viewReceipt(id){let x=D.payments.find(v=>v.id===id),iv=D.invoices.find(v=>v.id===x.invoice_id),p=D.projects.find(v=>v.project_id===x.project_id),c=clientForProject(p);app.innerHTML=`<div class="panel doc"><div class="dochead"><div><h2>恆輝建築（香港）有限公司</h2><div>UNIBRIGHT CONSTRUCTION (H.K.) LIMITED</div></div><div><h2>RECEIPT 收據</h2><div class="meta">No. ${esc(x.receipt_no||'')}<br>日期：${esc(x.payment_date)}</div></div></div><div class="grid2 meta"><div><b>收到 FROM</b><br>${esc(c?.company_name||'')}<br>${esc(c?.contact_name||'')} ${esc(c?.phone||'')}</div><div><b>工程 PROJECT</b><br>${esc(p?.project_no||'')}<br>${esc(p?.project_name||'')}<br>Invoice：${esc(iv?.invoice_no||'')}</div></div><div style="margin:28px 0;padding:20px;border:2px solid var(--navy);border-radius:12px;text-align:center"><span class="muted">本次收款 AMOUNT RECEIVED</span><div style="font-size:34px;font-weight:900;color:var(--red);margin-top:5px">${hk(x.amount)}</div><div>${esc(x.method||'')} ${x.reference_no?'｜'+esc(x.reference_no):''}</div></div><div class="meta">備註：${esc(x.remarks||'—')}<br>中國工商銀行（亞洲）有限公司：720502009151<br>轉數快 FPS：120437801</div><div class="row no-print" style="margin-top:20px"><button class="btn light" onclick="receiptHome()">返回</button><button class="btn gold" onclick="window.print()">列印／PDF</button></div></div>`}
function pricingHome(){let customer=D.pricing.filter(x=>x.price_tier==='customer'),trade=D.pricing.filter(x=>x.price_tier==='trade');let rows=a=>a.map(x=>`<tr><td>${esc(x.item_code)}</td><td>${esc(x.description)}${x.inclusions?`<br><small class="muted">包括：${esc(x.inclusions)}</small>`:''}${x.exclusions?`<br><small class="muted">不包括：${esc(x.exclusions)}</small>`:''}</td><td>${esc(x.unit)}</td><td class="money">${hk(x.unit_price)}</td><td>${esc(x.pricing_rule||'')}</td></tr>`).join('');app.innerHTML=`<div class="panel"><h2>客戶價目</h2><div class="tablewrap"><table class="table"><tr><th>編號</th><th>工程項目</th><th>單位</th><th>單價</th><th>計價</th></tr>${rows(customer)}</table></div></div><div class="panel"><h2>同行合作價</h2><div class="tablewrap"><table class="table"><tr><th>編號</th><th>工程項目</th><th>單位</th><th>單價</th><th>計價</th></tr>${rows(trade)}</table></div></div>`}
load();
</script>
</body></html>
